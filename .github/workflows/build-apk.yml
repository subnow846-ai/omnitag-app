name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Sync Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/css
          mkdir -p android/app/src/main/assets/js
          mkdir -p android/app/src/main/assets/assets
          cp mobile.html android/app/src/main/assets/mobile.html
          cp manifest.json android/app/src/main/assets/manifest.json
          cp -r css/* android/app/src/main/assets/css/
          cp -r js/* android/app/src/main/assets/js/
          cp -r assets/* android/app/src/main/assets/assets/

      - name: Build Android APK with Gradle
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output
          cp android/app/build/outputs/apk/debug/app-debug.apk output/OmniTag.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniTag-APK
          path: output/OmniTag.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > release-notes.md
          ## 📱 OmniTag Android App (APK)

          Download and install the native Android APK directly on your phone!

          ### ⬇️ Direct Download Link:
          - **[OmniTag.apk](https://github.com/subnow846-ai/omnitag-app/releases/download/v1.0.0/OmniTag.apk)**

          ### 📲 How to Install on Android:
          1. Tap the download link above on your Android phone.
          2. When the download finishes, tap **Open** or tap the file in your **Downloads** folder.
          3. If Android displays a prompt, tap **Settings** and toggle **'Allow from this source'**.
          4. Tap **Install** and open **OmniTag**!
          EOF

          gh release upload v1.0.0 output/OmniTag.apk --clobber || \
          gh release create v1.0.0 output/OmniTag.apk \
            --title "OmniTag Mobile v1.0.0 (Android APK)" \
            --notes-file release-notes.md
